[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mustafahal-vidgen_jd286"
version = "0.1.0"
description = "在同一个输入里两两比对，检测文生视频工程师·合成数据的质量分水岭相关的矛盾表述，把冲突双方原样并排呈现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "mustafahal" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://mustafahal.github.io"
Repository = "https://github.com/mustafahal/vidgen_jd286"
Issues = "https://github.com/mustafahal/vidgen_jd286/issues"

[project.scripts]
vidgen_jd286 = "vidgen_jd286:main"

[tool.setuptools]
py-modules = ["vidgen_jd286"]
